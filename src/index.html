  <h1>Gare de triage : apprendre Git en composant des trains</h1>
  <p>Jeu gratuit pour apprendre Git. Chaque commit est une voiture, chaque branche une voie, HEAD la motrice au nez jaune. Vous tapez de vraies commandes Git dans un terminal pour recomposer la rame demandée.</p>
  <h2>5 lignes, 40 stations</h2>
  <ol>
    <li>Le dépôt : <code>commit</code>, <code>branch</code>, <code>switch</code></li>
    <li>Les jonctions : <code>merge</code>, <code>rebase</code></li>
    <li>Le tri : <code>cherry-pick</code>, <code>reset</code></li>
    <li>Les grandes lignes : <code>push</code>, <code>pull</code>, <code>revert</code></li>
    <li>Les accidents : <code>reflog</code> et réparations</li>
  </ol>
  <p>Stations de composition, pronostic, enquête (<code>log</code>, <code>show</code>), recherche de l’avarie (<code>bisect</code>), <code>rebase -i</code>, gitflow. Étoiles selon le nombre de manœuvres.</p>
  <p><strong>Activez JavaScript pour jouer.</strong> Code source : <a href="https://github.com/Lunik/sur-la-bonne-voie">github.com/Lunik/sur-la-bonne-voie</a>.</p>
